name: CI

on:
  push:
    branches: [main, production-readiness]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pip install -r requirements.txt
      - run: mypy agent_framework

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
      - run: pip install .
      - name: Importing the package has no side effects
        run: |
          cd "$(mktemp -d)"
          python -c "import agent_framework, agent_framework.agent, agent_framework.context"
          test ! -e agent_memory.db && test ! -e context_db

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: bandit -q -r agent_framework
      # The four chromadb advisories are all server-side: the collection-update
      # API (trust_remote_code), and the RBAC provider's missing tenant checks.
      # This package uses chromadb as an embedded PersistentClient -- no server,
      # no tenants, no auth provider -- and no fixed release exists (see the
      # threat model). Every other advisory still fails the job.
      - run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-311 --ignore-vuln GHSA-2wm9-hf6c-p5cr --ignore-vuln GHSA-36p7-vc44-83pf --ignore-vuln GHSA-xph7-9rjv-w5fr
      - name: No .env tracked
        run: test -z "$(git ls-files | grep -E '(^|/)\.env$')"
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agent-framework:ci .
      - name: Runs as non-root
        run: test "$(docker run --rm agent-framework:ci id -u)" = "10001"
      - name: Reports its configuration
        run: |
          docker run --rm agent-framework:ci | tee out.txt
          grep -q '^model: ' out.txt
      - name: Refuses to start strict without a key
        run: |
          if docker run --rm -e OPENAI_API_KEY= agent-framework:ci python -m agent_framework check --strict; then
            echo "expected non-zero exit"; exit 1; fi
      - name: Runs the test suite inside the image
        run: |
          docker run --rm -v "$PWD/tests:/app/tests:ro" agent-framework:ci \
            sh -c "pip install --user -q pytest && python -m pytest -q /app/tests"
